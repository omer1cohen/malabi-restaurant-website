<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bowl" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="malabi" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#fffef8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4e6d3;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="syrup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#faf8f5"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="220" rx="120" ry="60" fill="url(#bowl)" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Malabi pudding -->
  <ellipse cx="200" cy="200" rx="100" ry="45" fill="url(#malabi)"/>
  
  <!-- Rose syrup drizzle -->
  <path d="M 150 180 Q 180 170 200 175 Q 220 180 250 170" stroke="url(#syrup)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 160 190 Q 190 185 210 190 Q 230 195 240 185" stroke="url(#syrup)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Pistachios -->
  <ellipse cx="180" cy="185" rx="3" ry="2" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="195" cy="190" rx="2.5" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="210" cy="180" rx="3" ry="2.5" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="225" cy="195" rx="2" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="170" cy="200" rx="2.5" ry="2" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="230" cy="185" rx="2" ry="1.5" fill="#9ACD32" opacity="0.8"/>
  
  <!-- Bowl rim highlight -->
  <ellipse cx="200" cy="160" rx="120" ry="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="24" fill="#8b4513" text-anchor="middle" font-weight="bold">מלאבי קלאסי</text>
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="14" fill="#a0522d" text-anchor="middle">Classic Malabi</text>
</svg>
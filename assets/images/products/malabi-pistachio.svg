<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bowl" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="pistachio-malabi" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#F0F8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8F5D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDD8C0;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="pistachio-sauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FBC8F;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6B8E23;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#faf8f5"/>
  
  <!-- Bowl -->
  <ellipse cx="200" cy="220" rx="120" ry="60" fill="url(#bowl)" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Pistachio malabi pudding -->
  <ellipse cx="200" cy="200" rx="100" ry="45" fill="url(#pistachio-malabi)"/>
  
  <!-- Pistachio sauce drizzle -->
  <path d="M 150 180 Q 180 170 200 175 Q 220 180 250 170" stroke="url(#pistachio-sauce)" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 160 190 Q 190 185 210 190 Q 230 195 240 185" stroke="url(#pistachio-sauce)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Crushed pistachios - more abundant -->
  <ellipse cx="175" cy="185" rx="4" ry="2.5" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="190" cy="190" rx="3.5" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="205" cy="180" rx="4" ry="3" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="220" cy="195" rx="3" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="165" cy="200" rx="3.5" ry="2.5" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="235" cy="185" rx="3" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="185" cy="205" rx="2.5" ry="2" fill="#6B8E23" opacity="0.8"/>
  <ellipse cx="215" cy="200" rx="3" ry="2.5" fill="#8FBC8F" opacity="0.9"/>
  <ellipse cx="200" cy="175" rx="2.5" ry="2" fill="#9ACD32" opacity="0.8"/>
  <ellipse cx="180" cy="175" rx="2" ry="1.5" fill="#6B8E23" opacity="0.8"/>
  <ellipse cx="225" cy="175" rx="2.5" ry="2" fill="#8FBC8F" opacity="0.9"/>
  
  <!-- Whole pistachios for decoration -->
  <ellipse cx="160" cy="180" rx="2" ry="4" fill="#6B8E23" opacity="0.9"/>
  <ellipse cx="240" cy="190" rx="2" ry="4" fill="#6B8E23" opacity="0.9"/>
  
  <!-- Bowl rim highlight -->
  <ellipse cx="200" cy="160" rx="120" ry="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  <!-- Title -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="24" fill="#8b4513" text-anchor="middle" font-weight="bold">מלאבי פיסטוק</text>
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="14" fill="#a0522d" text-anchor="middle">Pistachio Malabi</text>
</svg>